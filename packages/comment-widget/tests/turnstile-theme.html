<!doctype html>
<!-- Run pnpm exec vite in packages/comment-widget and open /tests/turnstile-theme.html. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Turnstile theme regression</title>
    <link rel="stylesheet" href="../var.css" />
  </head>
  <body>
    <pre id="result">Running…</pre>
    <script type="module">
      import '../src/turnstile-captcha.ts';

      const renders = [];
      const removed = [];
      window.turnstile = {
        render(_container, options) {
          renders.push(options);
          return String(renders.length);
        },
        remove(id) { removed.push(id); },
        reset() {},
      };
      const host = document.createElement('div');
      const root = host.attachShadow({ mode: 'open' });
      const captcha = document.createElement('turnstile-captcha');
      captcha.siteKey = 'test';
      root.append(captcha);
      document.body.append(host);

      const settle = () => new Promise(resolve => setTimeout(resolve, 30));
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const expectTheme = async (theme) => {
        await settle();
        assert(renders.at(-1).theme === theme, `Expected ${theme}`);
      };

      try {
        await expectTheme('light');
        renders.at(-1).callback('old-token');
        document.documentElement.classList.add('dark');
        await expectTheme('dark');
        assert(captcha.token === '', 'Theme changes must clear the old token');
        assert(removed.length > 0, 'Theme changes must remove the old widget');
        const count = renders.length;
        document.documentElement.classList.add('unrelated');
        await settle();
        assert(renders.length === count, 'Unchanged themes must not remount');
        document.documentElement.className = '';
        await expectTheme('light');
        document.body.dataset.colorScheme = 'dark';
        await expectTheme('dark');
        host.style.colorScheme = 'light';
        await expectTheme('light');
        host.style.colorScheme = '';
        document.body.dataset.colorScheme = 'auto';
        await expectTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        host.remove();
        const disconnectedCount = renders.length;
        document.body.dataset.colorScheme = 'dark';
        await settle();
        assert(renders.length === disconnectedCount, 'Disconnected widgets must not render');
        document.body.append(host);
        await expectTheme('dark');
        // Leave auto enabled for browser automation to test live OS theme changes.
        document.body.dataset.colorScheme = 'auto';
        await settle();
        window.themeTest = { captcha, renders, removed };
        document.querySelector('#result').textContent = 'PASS';
      } catch (error) {
        document.querySelector('#result').textContent = `FAIL: ${error.message}`;
        throw error;
      }
    </script>
  </body>
</html>
