apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-comment-widget-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: number
          label: 评论分页条数
          name: size
          validation: required
          value: 20
        - $formkit: number
          label: 回复分页条数
          name: replySize
          id: replySize
          key: replySize
          min: 1
          step: 1
          validation: required|min:1
          value: 10
        - $formkit: checkbox
          label: 同时加载评论的回复
          name: withReplies
          id: withReplies
          key: withReplies
          value: false
        - $formkit: number
          label: 同时加载回复的条数
          if: "$get(withReplies).value === true"
          name: withReplySize
          id: withReplySize
          key: withReplySize
          min: 1
          max: "$get(replySize).value"
          step: 1
          validation: required|min:1
          help: 不能大于回复分页条数
          value: 5
        - $formkit: checkbox
          label: 显示评论者设备信息
          name: showCommenterDevice
          value: false
        - $formkit: checkbox
          label: 支持私密评论
          id: enablePrivateComment
          key: enablePrivateComment
          name: enablePrivateComment
          help: 开启之后，评论者可选是否私密评论，私密评论仅评论者（已登录）和网站管理员（包含评论查看权限）可见，
          value: false
        - $formkit: checkbox
          if: "$get(enablePrivateComment).value === true"
          label: 显示私密评论状态
          name: showPrivateCommentBadge
          id: showPrivateCommentBadge
          key: showPrivateCommentBadge
          value: true
          help: 开启后，私密评论会显示一个私密状态标识
    - group: security
      label: 安全设置
      formSchema:
        - $formkit: group
          name: captcha
          label: 验证码
          value:
            enable: false
            type: ALPHANUMERIC
          children:
            - $formkit: checkbox
              label: 匿名评论需要验证码
              name: anonymousCommentCaptcha
              id: anonymousCommentCaptcha
              key: anonymousCommentCaptcha
              value: false
            - $formkit: select
              label: 验证码类型
              if: "$get(anonymousCommentCaptcha).value === true"
              name: type
              id: type
              value: "ALPHANUMERIC"
              options:
                - label: 字母数字组合
                  value: "ALPHANUMERIC"
                - label: 算术验证码
                  value: "ARITHMETIC"
                - label: Cloudflare Turnstile
                  value: "TURNSTILE"
            - $el: div
              if: "$get(anonymousCommentCaptcha).value === true && $get(type).value === TURNSTILE"
              attrs:
                class: "space-y-2 rounded-base bg-gray-50 p-4 text-sm text-gray-700"
              children:
                - $el: strong
                  children: Cloudflare Turnstile 使用说明
                - $el: p
                  children: 在 Cloudflare 中创建 Turnstile 小组件，将站点域名加入允许列表，然后填写 Site Key，并在下方新建或选择包含 secretKey 字段的密钥，填入同一小组件的 Secret Key。
                - $el: p
                  children: 匿名评论和回复会自动进行验证，仅在需要人工确认时显示验证组件。点击提交后，完成验证即可继续发送；验证失败会保留输入内容。已登录用户无需验证。
                - $el: p
                  children: 如提示配置异常，请检查 Site Key、Secret Key 和允许的域名；管理员可通过 Halo 日志查看具体原因。
                - $el: ul
                  attrs:
                    class: "list-inside list-disc space-y-1"
                  children:
                    - $el: li
                      children:
                        - $el: a
                          attrs:
                            href: https://developers.cloudflare.com/turnstile/get-started/
                            target: _blank
                            rel: noopener noreferrer
                            class: underline
                          children: Turnstile 创建与配置指南
                    - $el: li
                      children:
                        - $el: a
                          attrs:
                            href: https://developers.cloudflare.com/turnstile/troubleshooting/testing/
                            target: _blank
                            rel: noopener noreferrer
                            class: underline
                          children: 本地测试密钥说明（正式站点请使用自己的密钥）
                    - $el: li
                      children:
                        - $el: a
                          attrs:
                            href: https://developers.cloudflare.com/turnstile/reference/content-security-policy/
                            target: _blank
                            rel: noopener noreferrer
                            class: underline
                          children: 启用 CSP 时的脚本与 iframe 配置
            - $formkit: text
              if: "$get(type).value === TURNSTILE"
              name: turnstileSiteKey
              label: Turnstile Site Key
              validation: required
            - $formkit: secret
              if: "$get(type).value === TURNSTILE"
              name: turnstileSecretRef
              label: Turnstile Secret Key
              descriptionPreset: 评论组件 Cloudflare Turnstile 验证密钥
              requiredKeys:
                - key: secretKey
                  help: 填入 Cloudflare Turnstile 提供的 Secret Key。
              validation: required
              help: 创建或选择包含 secretKey 的密钥，填入 Cloudflare 提供的 Secret Key。
            - $formkit: number
              if: "$get(type).value === ALPHANUMERIC"
              name: captchaLength
              key: captchaLength
              label: 验证码长度
              help: 字母数字组合验证码长度，不宜过长或过短，建议4-6位
              max: 8
              value: 4
              validation: required
            - $formkit: radio
              if: "$get(type).value === ALPHANUMERIC"
              name: ignoreCase
              key: ignoreCase
              label: 是否忽略验证码大小写验证
              help: 忽略大小写验证码，建议开启
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
            - $formkit: number
              if: "$get(type).value === ARITHMETIC"
              name: arithmeticRange
              key: arithmeticRange
              label: 计算范围
              help: 算术验证码计算范围
              value: 90
              validation: required
    - group: avatar
      label: 头像设置
      formSchema:
        - $formkit: checkbox
          label: 是否启用第三方头像
          name: enable
          id: enable
          key: enable
          value: false
        - $formkit: select
          label: 头像服务提供者
          if: "$get(enable).value === true"
          name: provider
          options:
            - label: "Gravatar"
              value: "gravatar"
          value: "gravatar"
        - $formkit: text
          label: 头像服务镜像地址
          if: "$get(enable).value === true"
          name: providerMirror
          value: ""
          help: 使用官方源则留空, 示例：https://gravatar.com
        - $formkit: select
          label: 头像策略
          if: "$get(enable).value === true"
          name: policy
          options:
            - label: "仅匿名用户"
              value: "anonymousUser"
            - label: "所有用户"
              value: "allUser"
            - label: "匿名&无头像用户"
              value: "noAvatarUser"
          value: "anonymousUser"
    - group: editor
      label: 编辑器
      formSchema:
        - $formkit: text
          name: placeholder
          label: 自定义评论框占位符
